# fly.toml — astroid.club gateway (preview tier)
#
# This file is what `fly deploy` reads. Override `app` at first launch
# (`fly launch --copy-config`) so the name matches your Fly account.
#
# Region pinning is intentional: keep the gateway close to the bulk of
# the holder base. `syd` (Sydney) is a good default for an NZ-operated
# preview; switch to `iad` / `sjc` / `fra` if your audience tilts that
# way.
#
# Scale up with `fly scale count 2 --region syd` once you're past
# preview; the in-memory anti-cheat / holder tracker is per-instance, so
# multi-region needs a sticky-session story or an external tracker.

app = "astroid-club-gw"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3002"
  # Defaults that are safe to live in repo. Real secrets (RPC URL with
  # API key, treasury key, Privy id, etc.) are injected via `fly secrets set`.
  CHAIN_ENABLED = "true"
  # Public on-chain $ASTROID mint — safe to commit (it's not a secret) and
  # required at boot when CHAIN_ENABLED=true. Decimals match the mint.
  ASTROID_MINT_ADDRESS = "8NwtzwGm4CV8Hm4fJXR69ac1MxDYuSaN3A9HVyikpump"
  ASTROID_DECIMALS = "6"
  HOLDER_PREWARM_ENABLED = "true"
  HOLDER_PREWARM_MAX_LOOKBACK = "100"

  # -- emission governor (reserve protection) --------------------------------
  # Bounds token issuance so mining can't outrun the treasury. Guards:
  #   1. DYNAMIC backing budget — pegged to the LIVE redeemer-treasury $ASTROID
  #      balance x EMISSION_BACKING_FRACTION (polled on an interval). Issuance
  #      tapers to 0 as outstanding liability approaches payable reserves, and
  #      scales automatically as the treasury grows. This is the primary guard.
  #   2. EMISSION_DAILY_CAP — hard ceiling on credits issued per rolling 24h,
  #      smoothing bursts regardless of headroom.
  #   3. EMISSION_BUDGET — STATIC floor used only before the first treasury poll
  #      / when chain is off. Keep 0 so a poll failure can't open the floodgates
  #      (the daily cap still applies).
  EMISSION_BUDGET = "0"
  EMISSION_BACKING_FRACTION = "0.8"
  EMISSION_DAILY_CAP = "250000"
  EMISSION_TAPER_FRACTION = "0.25"
  # Base reward per discovery, before resource/asteroid multipliers + variance.
  YIELD_BASE_PER_DISCOVERY = "50"

  # -- anti-spoof drill-power bound -------------------------------------------
  # Drill power is self-reported (no proof-of-work). Clamp the reported base to
  # DRILL_BASE_FREE + stake x DRILL_BASE_PER_STAKE before the tier multiplier so
  # a wallet can't claim the 10M hard cap with little/no stake. Default-on in
  # code; pinned here for visibility/tunability. Set DRILL_STAKE_BOUND=off to
  # disable.
  DRILL_STAKE_BOUND = "on"
  DRILL_BASE_FREE = "5000"
  DRILL_BASE_PER_STAKE = "1"

  # -- raid attack-power soft cap (whale balancing) ---------------------------
  # Mining is rate-capped, so huge drill is cosmetic there — but attack power
  # (drill x 0.5 + stake x 0.1) scaled linearly + unbounded, so one large stake
  # could faceroll raids. Above RAID_DRILL_SOFTCAP, each extra point of drill
  # counts at only RAID_DRILL_SOFTCAP_SLOPE (diminishing returns): staking more
  # is still always better, just sub-linear. Set RAID_DRILL_SOFTCAP=0 to disable.
  RAID_DRILL_SOFTCAP = "5000000"
  RAID_DRILL_SOFTCAP_SLOPE = "0.15"

[[services]]
  protocol = "tcp"
  internal_port = 3002
  auto_stop_machines = "off"   # WS connections die if the machine sleeps
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false

[checks]
  [checks.health]
    type = "http"
    port = 3002
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

# VM sizing: the gateway is light (an in-memory ECS world + WS). Start
# small; scale CPU before RAM if the tick loop saturates.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
